<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3TX | أداة اختصار الروابط الرسمية</title>
    <style>
        /* تصميم عصري وألوان سايبر بنك */
        :root {
            --main-color: #00f2ea; /* فيروزي تيك توك */
            --accent-color: #ff0050; /* وردي تيك توك */
            --bg-dark: #0f0f0f;
            --card-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #333;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--main-color), var(--accent-color));
            z-index: -1;
            border-radius: 27px;
            opacity: 0.3;
        }

        h1 {
            font-size: 70px;
            margin: 0;
            font-style: italic;
            font-weight: 900;
            background: linear-gradient(to right, var(--main-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -3px;
        }

        p {
            color: #aaa;
            font-size: 16px;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(45deg, var(--main-color), #00d1ca);
            color: #000;
            padding: 18px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            display: inline-block;
            transition: 0.4s;
            box-shadow: 0 5px 15px rgba(0, 242, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 242, 234, 0.6);
            background: var(--accent-color);
            color: white;
        }

        .ios-note {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }

        .ios-note b {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>3TX</h1>
        <p>مرحباً بك في أداة التحميل والاختصار</p>

        <a href="رابط_الموقع_المختصر_هنا" class="btn">دخول للأداة الآن</a>

        <div class="ios-note">
            <b>لمستخدمي iPhone:</b> عند فتح الرابط، اضغط مطولاً على الفيديو واختر "حفظ في الصور" إذا لم يبدأ التحميل تلقائياً.
        </div>
        
        <div style="margin-top: 20px; font-size: 10px; color: #444;">
            Version 2.0 | Secured by 3TX Cloud
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3TX | تحميل فيديوهات تيك توك</title>
    <style>
        :root { --main: #00f2ea; --accent: #ff0050; --bg: #0f0f0f; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; border: 1px solid #333; }
        h1 { color: var(--main); font-size: 50px; margin: 0; font-style: italic; text-shadow: 2px 2px var(--accent); }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #222; color: white; margin: 20px 0; box-sizing: border-box; outline: none; text-align: center; }
        .btn { background: var(--main); color: #000; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: var(--accent); color: white; }
        
        #result { display: none; margin-top: 25px; background: #252525; padding: 20px; border-radius: 15px; border: 1px dashed var(--main); }
        .loader { border: 4px solid #333; border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* تنبيه الأيفون */
        .ios-tip { display: none; background: rgba(255, 0, 80, 0.1); color: #ff8fa3; padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 15px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <h1>3TX</h1>
    <p>تحميل فيديوهات تيك توك بدون علامة مائية</p>
    
    <input type="text" id="videoUrl" placeholder="الصق رابط الفيديو هنا...">
    <button class="btn" id="dl-btn" onclick="fetchVideo()">جلب الفيديو</button>
    
    <div class="loader" id="loader"></div>

    <div id="result">
        <p>تم تجهيز الفيديو بنجاح!</p>
        <button class="btn" id="final-dl" onclick="startDownload()">تحميل الآن</button>
        
        <div class="ios-tip" id="ios-tip">
            <b>مستخدم أيفون؟</b> إذا لم يبدأ التحميل، اضغط على الزر أعلاه، ثم من القائمة اختر <b>"حفظ في الملفات"</b> أو اضغط مطولاً على الفيديو واختر <b>"حفظ الفيديو"</b>.
        </div>
    </div>
</div>

<script>
    let videoLink = "";

    async function fetchVideo() {
        const url = document.getElementById('videoUrl').value;
        if (!url) return alert("يرجى وضع رابط!");

        document.getElementById('loader').style.display = 'block';
        document.getElementById('dl-btn').disabled = true;
        document.getElementById('result').style.display = 'none';

        try {
            // استخدام API مجاني وسريع
            const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
            const data = await res.json();

            if (data.code === 0) {
                videoLink = data.data.play; // الرابط المباشر للفيديو
                document.getElementById('result').style.display = 'block';
                
                // كشف إذا كان الجهاز أيفون
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    document.getElementById('ios-tip').style.display = 'block';
                }
            } else {
                alert("تعذر جلب الفيديو، تأكد من الرابط.");
            }
        } catch (e) {
            alert("حدث خطأ في الاتصال بالسيرفر.");
        } finally {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('dl-btn').disabled = false;
        }
    }

    function startDownload() {
        if (!videoLink) return;

        // الطريقة الأفضل للأيفون والأندرويد معاً
        const a = document.createElement('a');
        a.href = videoLink;
        a.download = "3TX_Video.mp4"; // للأندرويد
        a.target = "_blank"; // للأيفون حتى يفتح الفيديو بصفحة جديدة للحفظ
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3TX | التحميل السريع</title>
    <style>
        /* الألوان الوردية اللي تحبها */
        :root { --pink: #ff0050; --bg: #0a0a0a; --card: #161616; }
        
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: var(--card); padding: 35px 25px; border-radius: 30px; width: 90%; max-width: 420px; text-align: center; border: 2px solid var(--pink); box-shadow: 0 0 20px rgba(255, 0, 80, 0.2); }
        
        h1 { color: var(--pink); font-size: 60px; margin: 0; font-style: italic; font-weight: 900; text-shadow: 3px 3px #00f2ea; }
        p { color: #ccc; font-size: 14px; margin-bottom: 20px; }
        
        input { width: 100%; padding: 18px; border-radius: 15px; border: 1px solid #333; background: #222; color: white; margin-bottom: 15px; box-sizing: border-box; outline: none; text-align: center; font-size: 16px; }
        input:focus { border-color: var(--pink); box-shadow: 0 0 10px var(--pink); }
        
        .btn { background: var(--pink); color: white; padding: 16px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 0, 80, 0.4); }
        .btn:active { transform: scale(0.95); }
        
        #result { display: none; margin-top: 25px; animation: fadeIn 0.5s; }
        .loader { border: 4px solid #222; border-top: 4px solid var(--pink); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .ios-msg { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; font-size: 12px; color: #aaa; margin-top: 15px; }
    </style>
</head>
<body>

<div class="box">
    <h1>3TX</h1>
    <p>أسرع أداة تحميل تيك توك وردية</p>
    
    <input type="text" id="urlInput" placeholder="الصق الرابط هنا...">
    <button class="btn" id="fetchBtn" onclick="getVideo()">جلب الفيديو</button>
    
    <div class="loader" id="loader"></div>

    <div id="result">
        <button class="btn" style="background: #00f2ea; color: black;" onclick="downloadFile()">تنزيل الفيديو الآن</button>
        <div class="ios-msg">
            ملاحظة للأيفون: إذا لم يبدأ التنزيل، اضغط مطولاً على الزر واختر "تنزيل الملف المرتبط".
        </div>
    </div>
</div>

<script>
    let finalVideoUrl = "";

    async function getVideo() {
        const input = document.getElementById('urlInput');
        const url = input.value;
        if (!url) return alert("حط رابط تيك توك!");

        // إظهار اللودر وتعطيل الزر
        document.getElementById('loader').style.display = 'block';
        document.getElementById('fetchBtn').disabled = true;
        document.getElementById('result').style.display = 'none';

        try {
            const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
            const json = await response.json();

            if (json.code === 0) {
                finalVideoUrl = json.data.play;
                
                // --- المطلب مالتك: حذف الرابط من الخانة فوراً ---
                input.value = ""; 
                
                document.getElementById('result').style.display = 'block';
            } else {
                alert("الرابط غلط أو الفيديو خاص.");
            }
        } catch (err) {
            alert("اكو مشكلة بالاتصال.");
        } finally {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('fetchBtn').disabled = false;
        }
    }

    // وظيفة التحويل لـ Blob لحل مشكلة الأيفون
    async function downloadFile() {
        if (!finalVideoUrl) return;

        // محاولة التحميل كـ Blob لإجبار الأيفون على التنزيل
        try {
            const res = await fetch(finalVideoUrl);
            const blob = await res.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = "3TX_Video_" + Date.now() + ".mp4";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(blobUrl);
        } catch (e) {
            // إذا فشل الـ Blob (بسبب الحماية)، نفتح الرابط بتبويب جديد
            window.open(finalVideoUrl, '_blank');
        }
    }
</script>

</body>
</html>
